<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password — Take-off</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="auth.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #0d0d0d; color: #e0e0e0; font-size: 14px;
       display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #111; border: 1px solid #1e1e1e; border-radius: 6px; padding: 28px; width: 360px; }
h1 { color: #f0c040; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.sub { color: #555; font-size: 12px; margin-bottom: 20px; }
label { display: block; color: #888; font-size: 12px; margin: 12px 0 4px; }
input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
        padding: 9px 10px; border-radius: 3px; font-family: monospace; font-size: 13px; }
button { width: 100%; margin-top: 18px; background: #f0c040; color: #111; border: 0;
         padding: 10px; border-radius: 3px; font-family: monospace; font-weight: bold; font-size: 13px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.msg { margin-top: 14px; font-size: 12px; min-height: 16px; }
.msg.err { color: #e06c6c; } .msg.ok { color: #6ce08a; }
</style>
</head>
<body>
<div class="card">
  <h1>Take-off</h1>
  <div class="sub" id="sub">Set a password to finish joining</div>

  <label>New password</label>
  <input id="pw" type="password" autocomplete="new-password" autofocus>
  <label>Confirm password</label>
  <input id="pw2" type="password" autocomplete="new-password">

  <button id="submit">Set password</button>
  <div class="msg" id="msg"></div>
</div>

<script>
(function () {
  var sb = window.TakeoffAuth && window.TakeoffAuth.client;
  var $ = function (id) { return document.getElementById(id); };
  function setMsg(t, cls) { var m = $("msg"); m.textContent = t || ""; m.className = "msg " + (cls || ""); }

  // The invite link drops a session into the URL; supabase-js picks it up.
  (async function () {
    if (!sb) { setMsg("Auth not initialized", "err"); return; }
    var s = await sb.auth.getSession();
    if (!s.data || !s.data.session) {
      $("submit").disabled = true;
      setMsg("This invite link is invalid or has expired. Ask your admin to resend it.", "err");
    }
  })();

  $("submit").onclick = async function () {
    var pw = $("pw").value, pw2 = $("pw2").value;
    if (pw.length < 8) { setMsg("Use at least 8 characters", "err"); return; }
    if (pw !== pw2) { setMsg("Passwords don't match", "err"); return; }
    $("submit").disabled = true; setMsg("Saving…");
    try {
      var r = await sb.auth.updateUser({ password: pw });
      if (r.error) throw r.error;
      setMsg("Password set. Redirecting…", "ok");
      setTimeout(function () { location.replace("projects.html"); }, 800);
    } catch (e) {
      setMsg(e.message || "Could not set password", "err");
      $("submit").disabled = false;
    }
  };

  document.addEventListener("keydown", function (e) { if (e.key === "Enter") $("submit").click(); });
})();
</script>
</body>
</html>
