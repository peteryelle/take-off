<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Take-off</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="auth.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #0d0d0d; color: #e0e0e0; font-size: 14px;
       display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #111; border: 1px solid #1e1e1e; border-radius: 6px; padding: 28px; width: 340px; }
h1 { color: #f0c040; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.sub { color: #555; font-size: 12px; margin-bottom: 20px; }
label { display: block; color: #888; font-size: 12px; margin: 12px 0 4px; }
input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
        padding: 9px 10px; border-radius: 3px; font-family: monospace; font-size: 13px; }
button { width: 100%; margin-top: 18px; background: #f0c040; color: #111; border: 0;
         padding: 10px; border-radius: 3px; font-family: monospace; font-weight: bold; font-size: 13px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.note { margin-top: 16px; color: #555; font-size: 11px; text-align: center; line-height: 1.5; }
.msg { margin-top: 14px; font-size: 12px; min-height: 16px; }
.msg.err { color: #e06c6c; } .msg.ok { color: #6ce08a; }
</style>
</head>
<body>
<div class="card">
  <h1>Take-off</h1>
  <div class="sub">Sign in to your organization</div>

  <label>Email</label>
  <input id="email" type="email" autocomplete="username" autofocus>
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <button id="submit">Sign in</button>
  <div class="msg" id="msg"></div>
  <div class="note">Take-off is invite only. Contact your administrator for access.</div>
</div>

<script>
(function () {
  var sb = window.TakeoffAuth && window.TakeoffAuth.client;
  var $ = function (id) { return document.getElementById(id); };
  function nextUrl() {
    var p = new URLSearchParams(location.search).get("next");
    return p && p.indexOf("//") === -1 ? p : "projects.html";
  }
  function setMsg(t, cls) { var m = $("msg"); m.textContent = t || ""; m.className = "msg " + (cls || ""); }

  $("submit").onclick = async function () {
    if (!sb) { setMsg("Auth not initialized — check anon key in auth.js", "err"); return; }
    var email = $("email").value.trim();
    var password = $("password").value;
    if (!email || !password) { setMsg("Email and password required", "err"); return; }
    $("submit").disabled = true; setMsg("Signing in…");
    try {
      var r = await sb.auth.signInWithPassword({ email: email, password: password });
      if (r.error) throw r.error;
      location.replace(nextUrl());
    } catch (e) {
      setMsg(e.message || "Sign in failed", "err");
    } finally {
      $("submit").disabled = false;
    }
  };

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("submit").click();
  });
})();
</script>
</body>
</html>
